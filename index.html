  .card.destacar { box-shadow: 0 0 0 2px var(--destaque); }
  .gn { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--destaque); color: var(--card); font-weight: 700; font-size: 11px; padding: 0 4px; }

  .lin { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--borda); font-size: 14px; flex-wrap: wrap; }
  .lin:last-child { border-bottom: 0; }
  .hist { border-left: 2px solid var(--borda); padding: 2px 0 12px 12px; font-size: 14px; }
  .hist b { font-weight: 600; }
  @media (max-width: 760px) {
    .form, .det { grid-template-columns: 1fr; }
    .placar { position: static; }
    .im { grid-template-columns: 48px minmax(0,1fr); }
    .im > :last-child { grid-column: 2; }
  }
</style>

  if (n >= 30) return { t: `${n} dias · atualizar agora`, c: 'ambar', n };

}

      <div class="q" style="margin-top:4px"><label style="font-weight:600;color:var(--texto)">Sobre o prédio</label></div>
      <div class="grade">${campo('andares', 'Andares do prédio', '12', 'number')}${campo('unid_andar', 'Unidades por andar', '4', 'number')}${campo('elevadores', 'Elevadores', '2', 'number')}</div>`;
    return `
      <div class="grade">${campo('area', 'Área construída (m²)', '120', 'number')}${campo('area_terreno', 'Área do terreno (m²)', '360', 'number')}</div>
      <div class="grade">${campo('quartos', 'Quartos', '3', 'number')}${campo('suites', 'Suítes', '1', 'number')}${campo('banh', 'Banheiros', '2', 'number')}${campo('salas', 'Salas', '1', 'number')}</div>
      <div class="grade">${campo('vagas', 'Vagas de garagem', '2', 'number')}${+F.vagas > 0 ? `${escolha('vaga_tipo', 'A vaga é coberta?', [['coberta', 'Coberta'], ['descoberta', 'Descoberta'], ['ambas', 'Tem coberta e descoberta']])}` : ''}</div>`;
  }
  if (passo === 3) {
    if (t === 'terreno') return `
      ${escolha('loteamento', 'Fica em loteamento fechado?', simNao)}
      ${F.loteamento === 'sim' ? chips('lazer', 'Lazer do loteamento (marque pelo menos 3)', OPC.lazer.terreno) : ''}
      ${chips('infra', 'Infraestrutura disponível', OPC.infra)}`;
    return `
      ${t !== 'sala' ? chips('lazer', t === 'apto' ? 'Lazer do condomínio (pelo menos 3)' : 'Lazer do imóvel (pelo menos 3)', OPC.lazer[t]) : ''}
      ${chips('intr', 'Itens internos (pelo menos 3)', OPC.intr[t])}
      ${chips('ext', t === 'casa' ? 'Itens externos (pelo menos 3)' : 'Itens do prédio (pelo menos 3)', OPC.ext[t])}`;
  }
  if (passo === 4) return `
    <div class="aviso" style="background:var(--azul-claro);color:var(--azul)">Com essas respostas a IA escreve o título e a descrição do anúncio para o site, já pensando no Google. Você não precisa escrever o texto.</div>
    ${chips('estado', 'Estado do imóvel', OPC.estado, 1)}
    ${chips('dest', 'Destaques do imóvel (até 5)', OPC.dest, 5)}
    ${chips('perto', 'O que tem perto', OPC.perto)}
    ${chips('perfil', 'Ideal para', OPC.perfil)}
    <div class="q"><label>O que mais chama atenção na visita? (1 a 2 frases)</label><textarea data-k="frase" rows="2" placeholder="Casa muito iluminada, com pátio nos fundos ótimo para churrasco">${esc(F.frase)}</textarea></div>
    <div class="card" style="background:var(--fundo)"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-weight:600">Descrição do anúncio</b><button type="button" data-gerardesc>${F.descricao_seo ? '↻ Gerar outra versão' : '✨ Gerar descrição com IA'}</button></div>
      <div id="desc-box">${blocoDescricao(F.descricao_seo)}</div></div>`;
  if (passo === 5) {
    const constr = t === 'casa' ? 'A casa' : t === 'apto' ? 'O apartamento' : 'A sala';
    const avisoAver = F.aver === 'sim' ? '<div class="aviso" style="background:var(--verde-claro);color:var(--verde)">Averbado: o imóvel pode ser vendido com financiamento.</div>'
      : F.aver === 'nao' ? '<div class="aviso" style="background:var(--vermelho-claro);color:var(--vermelho)">Sem averbação o banco não financia: a venda fica só à vista ou com permuta. Marcamos "Aceita financiamento: não".</div>'
      : F.aver === 'naosei' ? '<div class="aviso" style="background:var(--ambar-claro);color:var(--ambar)">Confira na matrícula se a construção aparece averbada. Isso define se o cliente pode financiar.</div>' : '';
    return `
    <div class="q"><label>Matrícula do imóvel</label>
      <div class="grade">${campo('mat_num', 'Número da matrícula *', '12.345')}${campo('mat_cartorio', 'Cartório de registro', '1º Ofício de Araranguá')}</div>
      ${anexo('mat_arq', 'Matrícula atualizada (PDF)', 'Não é obrigatório, mas vale ' + ITENS.find(i => i.k === 'mat').p[IDX[t]] + ' pontos. Emitida há até 30 dias.', 'application/pdf')}
      <div class="grade" style="margin:8px 0 4px">${campo('mat_data', 'Data de emissão da matrícula', '', 'date', F.mat_data && dias(F.mat_data) > 30 ? '<span style="color:var(--vermelho)">Emitida há mais de 30 dias: peça uma nova.</span>' : '')}</div>
    </div>
    ${t !== 'terreno' ? `<div class="q">${escolha('aver', constr + ' está averbad' + (t === 'casa' || t === 'sala' ? 'a' : 'o') + ' na matrícula?', [['sim', 'Sim, averbado'], ['nao', 'Não ou só parte averbada'], ['naosei', 'Não sei']])}${avisoAver}${F.aver === 'sim' ? anexo('aver_arq', 'Comprovante da averbação', 'Opcional: certidão ou página da matrícula com a averbação') : ''}</div>` : ''}
    <div class="q"><label>Documentos do proprietário</label>
      ${anexo('cnh_arq', 'CNH ou RG e CPF do proprietário *', 'PDF ou foto')}
      ${anexo('comp_arq', 'Comprovante de endereço do proprietário *', 'PDF ou foto')}
      ${t === 'terreno' ? anexo('cnd_arq', 'Certidão negativa de débitos municipais', 'Opcional') : ''}
    </div>`;
  }
  const minimo = t === 'terreno' ? 10 : 15;
  const prev = (fotosSessao[F.id] || []).slice(0, 24);
  return `
    <div class="q"><label>Fotos do imóvel (mínimo ${minimo}${t === 'terreno' ? ': frente, laterais, fundos e entorno' : ', com fachada e todos os ambientes'})</label>
      ${anexo('fotos', `${F.fotos.length} de ${minimo} fotos`, 'Selecione várias de uma vez', 'image/*', true)}
      ${prev.length ? `<div class="fotos">${prev.map(u => `<div style="background-image:url(${u})"></div>`).join('')}</div>` : (F.fotos.length ? `<div class="fotos">${F.fotos.slice(0, 12).map(n => `<div>${esc(n)}</div>`).join('')}</div>` : '')}
      ${t !== 'terreno' ? `<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px"><input type="checkbox" data-b="fachada" ${F.fachada ? 'checked' : ''} style="width:auto"> As fotos incluem a fachada e todos os ambientes</label>` : ''}
      <div class="dica">As fotos ficam guardadas para irem para o site depois.</div>
    </div>
    <div class="q"><label>Divulgação</label>
      ${anexo('placa_arq', 'Foto da placa instalada', 'Foto tirada no local, com data', 'image/*')}
      ${t === 'apto' || t === 'sala' ? anexo('placa_proib_arq', 'Condomínio proíbe placa?', 'Anexe o regimento ou comunicado (conta a placa cheia)') : ''}
      ${t === 'terreno' ? anexo('drone_arq', 'Foto aérea ou de drone', 'Opcional', 'image/*') : ''}
    </div>
    ${campo('video', t === 'terreno' ? 'Link do vídeo ou drone' : 'Link do vídeo ou tour 360', 'https://youtu.be/...')}
    ${t !== 'terreno' ? `<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" data-b="chave" ${F.chave ? 'checked' : ''} style="width:auto"> A chave ficou na imobiliária</label>` : ''}`;
}

function blocoDescricao(dsc) {
  if (!dsc) return '<div class="dica" style="margin-top:6px">Responda as perguntas acima e clique para a IA escrever o título e o texto do anúncio.</div>';
  return `<div style="margin-top:8px;font-size:14px">
    <div class="dica">Título do Google (${(dsc.titulo_google || '').length}/60)</div><div style="font-weight:600">${esc(dsc.titulo_google)}</div>
    <div class="dica" style="margin-top:6px">Meta description (${(dsc.meta_description || '').length}/155)</div><div>${esc(dsc.meta_description)}</div>
    <div class="dica" style="margin-top:6px">Palavra-chave: ${esc(dsc.palavra_chave)}${dsc.long_tails?.length ? ' · ' + dsc.long_tails.map(esc).join(' · ') : ''}</div>
    <h3 style="font-size:16px;margin:10px 0 4px">${esc(dsc.h1)}</h3>
    ${(dsc.secoes || []).map(x => `<div style="font-weight:600;margin-top:6px">${esc(x.h2)}</div><div style="line-height:1.6">${esc(x.texto)}</div>`).join('')}</div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-gerardesc]'); if (!b || !F) return;
  const box = document.getElementById('desc-box');
  const dados = {}; for (const k of ['tipo', 'bairro', 'cidade', 'uf', 'ref', 'predio', 'venda', 'fin', 'perm', 'area', 'area_global', 'area_terreno', 'medidas', 'quartos', 'suites', 'banh', 'salas', 'vagas', 'vaga_tipo', 'andar', 'andares', 'elevadores', 'posicao', 'topografia', 'zoneamento', 'usos', 'lazer', 'intr', 'ext', 'infra', 'estado', 'dest', 'perto', 'perfil', 'frase', 'aver']) if (!vazio(F[k]) && !(Array.isArray(F[k]) && !F[k].length)) dados[k] = F[k];
  dados.tipo = TIPOS[F.tipo] || F.tipo;
  b.disabled = true; box.innerHTML = '<div class="dica" style="margin-top:6px">Escrevendo a descrição… (leva alguns segundos)</div>';
  const { data, error } = await db.functions.invoke('crm-vendas-descricao', { body: { dados } });
  b.disabled = false;
  let msg = data?.erro;
  if (error) { try { msg = (await error.context.json()).erro; } catch (_) { msg = 'Não foi possível gerar agora.'; } }
  if (msg || !data?.descricao) { box.innerHTML = `<div class="erro" style="margin-top:6px">${esc(msg || 'Não foi possível gerar agora.')}</div>${F.descricao_seo ? blocoDescricao(F.descricao_seo) : ''}`; return; }
  F.descricao_seo = data.descricao; box.innerHTML = blocoDescricao(F.descricao_seo); b.textContent = '↻ Gerar outra versão';
  aviso('Descrição gerada. Ela é salva junto com o cadastro.');
});
function placar(d) {
  const { total, obr, obrMax, completo, linhas } = pontuar(d);
  const fx = faixa(total, completo);
  return `<div class="card placar">
    <div class="grande"><small style="color:var(--suave)">Nota do imóvel</small><b>${total}</b></div>
    <div class="trilho"><div style="width:${total}%"></div></div>
    <div style="text-align:center"><span class="selo ${fx.c}">${fx.t}</span></div>
    <div style="text-align:center;font-size:12px;color:var(--suave);margin-top:6px">Obrigatórios: ${obr} de ${obrMax}</div>
    <div class="itens">${d.tipo ? linhas.map(l => `<div class="${l.ok ? 'ok' : ''} ${l.dep ? 'dep' : ''}"><span>${l.ok ? '✓ ' : ''}${l.l}${l.o ? ' *' : ''}${l.dep ? ' (todo mês)' : ''}</span><span>${l.pts}</span></div>`).join('') : '<div>Escolha o tipo do imóvel para ver a pontuação.</div>'}</div>
    <div style="font-size:11px;color:var(--suave);margin-top:6px">* obrigatório para enviar</div>
  </div>`;
}

    ${devolvido ? `<div class="aviso" style="background:var(--destaque-claro);color:var(--destaque)"><b>Devolvido pelo gestor:</b> ${esc(F.obs_devolucao)}</div>` : ''}
    <div class="form">

function atualizarPlacar() { const p = document.getElementById('placar'); if (p) p.innerHTML = placar(F); }
function abrirForm(im) { F = JSON.parse(JSON.stringify(im)); passo = 0; tela = { nome: 'form' }; render(); }
async function gravarF(status) {
  const antes = F.status;
  if (status) F.status = status;
  const linha = paraLinha(F);
  const existe = DB.imoveis.some(i => i.id === F.id);
  const q = existe ? db.from('crm_vendas_imoveis').update(linha).eq('id', F.id) : db.from('crm_vendas_imoveis').insert(linha);
  const { data, error } = await q.select().single();
  if (error) { F.status = antes; document.getElementById('erro').textContent = 'Não foi possível salvar: ' + error.message; return null; }
  F.codigo = data.codigo;
  await carregar();
  return data;
}

  const L = (a, b) => vazio(b) || (Array.isArray(b) && !b.length) ? '' : `<div class="linha"><span>${a}</span><span>${esc(Array.isArray(b) ? b.join(', ') : b)}</span></div>`;
  const doc = (n, v, k) => `<div class="linha"><span>${n}</span><span>${v ? `<span class="selo verde">${esc(v)}</span>${im.arqs && im.arqs[k] ? ` <button class="link" data-verarq="${esc(im.arqs[k])}">abrir</button>` : ''}` : '<span class="selo vermelho">Falta</span>'}</span></div>`;
  return `

        <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start">

          <div style="color:var(--suave);font-size:14px">${esc(im.end)}, ${esc(im.cidade)}${im.uf ? '/' + esc(im.uf) : ''}${im.cep ? ' · CEP ' + esc(im.cep) : ''} · ${codigoTxt(im)}${im.codigo_imoview ? ' · Imoview ' + esc(im.codigo_imoview) : ''} · ${esc(CORRETORES[im.corretor] || '')}</div>
          <div class="selos" style="margin-top:6px"><span class="selo ${st.c}">${st.t}</span>${at ? `<span class="selo ${at.c}">${at.t}</span>` : ''}</div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${podeEditar ? `<button class="principal" data-editar="${im.id}">${im.status === 'devolvido' ? 'Ajustar e reenviar' : 'Continuar cadastro'}</button>` : ''}
            ${im.status === 'ativo' && (gestor() || im.corretor === usuario) ? `<button data-atualizei="${im.id}">Registrar atualização com o proprietário</button>` : ''}
          </div>
        </div>
        ${im.status === 'devolvido' && im.obs_devolucao ? `<div class="aviso" style="background:var(--destaque-claro);color:var(--destaque);margin-top:12px"><b>Motivo da devolução:</b> ${esc(im.obs_devolucao)}</div>` : ''}
        ${at && at.n >= 61 ? `<div class="aviso" style="background:var(--vermelho-claro);color:var(--vermelho);margin-top:12px">Passou de 60 dias sem atualização: pela regra, a posse deste agenciamento passa para outro corretor.</div>` : ''}
        <div class="bloco" style="margin-top:14px"><h3>Dados</h3>
          ${L('Valor de venda', brl(im.venda))}${L('Condomínio', im.condominio && brl(im.condominio))}${L('IPTU por ano', im.iptu && brl(im.iptu))}
          ${L(im.tipo === 'apto' || im.tipo === 'sala' ? 'Área privativa' : 'Área', im.area && im.area + ' m²')}${L('Área global', im.area_global && im.area_global + ' m²')}${L('Terreno', im.area_terreno && im.area_terreno + ' m²')}${L('Medidas (frente x laterais)', im.medidas && im.medidas + ' m')}
          ${L('Quartos / suítes / banheiros', [im.quartos, im.suites, im.banh].some(x => !vazio(x)) ? `${im.quartos || 0} / ${im.suites || 0} / ${im.banh || 0}` : '')}
          ${L('Salas', im.salas)}${L('Vagas', vazio(im.vagas) ? '' : im.vagas + ({ coberta: ' (coberta)', descoberta: ' (descoberta)', ambas: ' (coberta e descoberta)' }[im.vaga_tipo] || ''))}${L('Andar', im.andar)}${L('Andares do prédio', im.andares)}${L('Unidades por andar', im.unid_andar)}${L('Elevadores', im.elevadores)}${L('Posição solar', im.posicao)}${L('Topografia', im.topografia)}${L('Zoneamento', im.zoneamento)}${L('Atividades permitidas', im.usos)}
          ${L('Financiamento / permuta', im.fin ? `${im.fin === 'sim' ? 'Aceita' : 'Não aceita'} / ${im.perm === 'sim' ? 'Aceita' : 'Não aceita'}` : '')}
          ${L('Lazer', im.lazer)}${L('Itens internos', im.intr)}${L('Itens externos', im.ext)}${L('Infraestrutura', im.infra)}

        <div class="bloco"><h3>Para a descrição do anúncio</h3>

        </div>

        </div>
        ${gestor() && im.status === 'aguardando' ? `
        <div class="card" style="background:var(--fundo)">
          <h3 style="margin:0 0 8px;font-size:15px">Sua decisão</h3>
          <textarea id="obs" rows="2" placeholder="Observação (obrigatória para devolver): ex. falta foto da cozinha"></textarea>
          <div class="erro" id="erro"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="principal" data-aprovar="${im.id}">Aprovar agenciamento</button><button data-devolver="${im.id}">Devolver para o corretor</button></div>
        </div>` : ''}
        <div class="bloco" style="margin-top:14px" id="hist"></div>
      </div>
      <div>${placar(im)}</div>
    </div>`;
}

async function extrasDetalhe(id) {
  const im = DB.imoveis.find(i => i.id === id); if (!im) return;
  const { data: h } = await db.from('crm_vendas_imoveis_historico').select('quando, texto').eq('imovel_id', id).order('quando', { ascending: false });
  const el = document.getElementById('hist');
  if (el && h && h.length) el.innerHTML = '<h3>Histórico</h3>' + h.map(x => `<div class="linha"><span>${new Date(x.quando).toLocaleDateString('pt-BR')}</span><span>${esc(x.texto)}</span></div>`).join('');
  const paths = (im.fotos_paths || []).slice(0, 12);
  if (paths.length) {
    const { data: urls } = await db.storage.from('crm-vendas').createSignedUrls(paths, 3600);
    const box = document.getElementById('fotos-det');
    if (box && urls) box.innerHTML = urls.filter(u => u.signedUrl).map(u => `<div style="background-image:url('${u.signedUrl}')"></div>`).join('');
  }
}

// ---------- eventos ----------

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'busca') { filtro.busca = t.value; const pos = t.selectionStart; render(); const b = document.getElementById('busca'); b.focus(); b.setSelectionRange(pos, pos); return; }
  if (tela.nome === 'form' && t.dataset.k) {
    if (t.dataset.k === 'cep') { const dg = t.value.replace(/\D/g, '').slice(0, 8); t.value = dg.length > 5 ? dg.slice(0, 5) + '-' + dg.slice(5) : dg; }
    F[t.dataset.k] = t.value;

// Ao completar o CEP, busca rua, bairro, cidade e UF no ViaCEP (serviço público e gratuito), igual ao sistema de locação.
let cepBuscado = '';
async function buscarCep(valor) {
  const cep = valor.replace(/\D/g, '');
  const info = document.getElementById('cep-info');
  const mostrar = (txt, erro) => { if (info) { info.textContent = txt; info.style.color = erro ? 'var(--vermelho)' : ''; } };
  if (cep.length !== 8) { cepBuscado = ''; return; }
  if (cep === cepBuscado) return;
  cepBuscado = cep;
  mostrar('Buscando endereço…');
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (F.cep.replace(/\D/g, '') !== cep) return;
    if (!r.ok || d.erro) { mostrar('CEP não encontrado. Preencha o endereço à mão.', true); return; }
    const pr = (k, v) => { if (v) { F[k] = v; const el = document.querySelector(`[data-k="${k}"]`); if (el) el.value = v; } };
    pr('rua', d.logradouro); pr('bairro', d.bairro); pr('cidade', d.localidade); pr('uf', d.uf);
    F.end = [F.rua, F.numero, F.compl].filter(Boolean).join(', ');
    mostrar('Endereço encontrado. Confira e preencha o número.');
    document.querySelector(`[data-k="${d.logradouro ? 'numero' : 'rua'}"]`)?.focus();
    atualizarPlacar();
  } catch (e) {
    mostrar('Não foi possível buscar o CEP agora. Preencha o endereço à mão.', true);
  }
}

// Sobe os arquivos para o Supabase (pasta do usuário / imóvel) e guarda o caminho no cadastro.
async function enviarArquivos(k, arquivos) {
  const erro = document.getElementById('erro');
  erro.style.color = 'var(--suave)'; erro.textContent = `Enviando ${arquivos.length > 1 ? arquivos.length + ' arquivos' : 'arquivo'}…`;
  const nomeSeguro = (n) => n.normalize('NFD').replace(/[^\w.-]+/g, '_').slice(-80);
  let falhas = 0;
  for (const f of arquivos) {
    const path = `${sessao.user.id}/${F.id}/${k}-${Date.now()}-${nomeSeguro(f.name)}`;
    const { error } = await db.storage.from('crm-vendas').upload(path, f, { contentType: f.type || undefined });
    if (error) { falhas++; continue; }
    if (k === 'fotos') {
      F.fotos = F.fotos.concat(f.name); F.fotos_paths = (F.fotos_paths || []).concat(path);
      fotosSessao[F.id] = (fotosSessao[F.id] || []).concat(URL.createObjectURL(f));
    } else {
      F[k] = f.name; F.arqs = { ...(F.arqs || {}), [k]: path };
      if (k === 'aver_arq' && !F.aver) F.aver = 'sim';
    }
  }
  if (tela.nome !== 'form') return;
  document.getElementById('corpo').innerHTML = corpoPasso();
  atualizarPlacar();
  const e2 = document.getElementById('erro');
  e2.style.color = ''; e2.textContent = falhas ? `${falhas} arquivo(s) não foram enviados. Use PDF ou foto de até 20 MB.` : '';
}

function validarPasso() {
  if (passo === 0 && !F.tipo) return 'Escolha o tipo do imóvel.';
  if (passo === 0 && (!F.cep || !F.rua || !F.numero || !F.bairro || !F.cidade)) return 'Preencha CEP, rua, número, bairro e cidade.';
  if (passo === 1 && !(+F.venda > 0)) return 'Informe o valor de venda.';
  if (passo === 5 && !String(F.mat_num).trim()) return 'Informe o número da matrícula para continuar.';
  return '';
}

// ---------- funis: Pré-atendimento (SDR) e Funil de vendas (funil "Atendimento" do CRM Leads) ----------
const FUN = { cfg: null, pre: null, sdrs: [], fases: [], status: [], leads: [], busca: '', corretor: '' };
async function carregarFunil() {
  const { data: cs } = await db.from('crm_vendas_config').select('chave, valor').in('chave', ['funil_vendas', 'funil_pre', 'sdrs']);
  const c = Object.fromEntries((cs || []).map(x => [x.chave, x.valor]));
  if (!c.funil_vendas) { aviso('Funil de vendas não configurado.', true); return; }
  FUN.cfg = c.funil_vendas; FUN.pre = c.funil_pre || null; FUN.sdrs = c.sdrs || [];
  const funis = [FUN.cfg.funil, FUN.pre?.funil].filter(Boolean);
  const [f, st, ld] = await Promise.all([
    db.from('fases').select('id, nome, ordem, funil_id').order('ordem'),
    db.from('crm_vendas_status').select('*').eq('ativo', true).order('ordem'),
    db.from('leads').select('id, nome, telefone, email, origem, campanha, codigo_imovel, corretor_id, fase_id, funil_id, fase_atualizada_em, valor_negociacao, created_at').in('funil_id', funis).order('fase_atualizada_em', { ascending: false }).limit(3000),
  ]);
  if (f.error || st.error || ld.error) { aviso('Não foi possível carregar o funil.', true); return; }
  FUN.fases = f.data; FUN.status = st.data; FUN.leads = VER ? ld.data.filter(l => l.corretor_id === VER) : ld.data;
  // Avisos de prazo (mesma regra que vai para a pontuação): fica o mais grave de cada lead.
  const { data: al } = await db.rpc('crm_vendas_alertas');
  FUN.alerta = {};
  const peso = (a) => (a.nivel === 'vermelho' ? 10 : 0) + ({ retorno: 4, feedback: 3, followup: 2, parado: 1 }[a.tipo] || 0);
  (al || []).forEach(a => { const atual = FUN.alerta[a.lead_id]; if (!atual || peso(a) > peso(atual)) FUN.alerta[a.lead_id] = a; });
  const ids = FUN.leads.map(l => l.id);
  FUN.ultimo = {};
  const marca = (id, quando, tipo) => { const u = FUN.ultimo[id]; if (!u || new Date(quando) > new Date(u.quando)) FUN.ultimo[id] = { quando, tipo }; };
  for (let i = 0; i < ids.length; i += 200) {
    const parte = ids.slice(i, i + 200);
    const [it, mv] = await Promise.all([
      db.from('interacoes').select('lead_id, tipo, created_at').in('lead_id', parte),
      db.from('crm_vendas_movimentos').select('lead_id, quando, extras').in('lead_id', parte),
    ]);
    (it.data || []).forEach(x => marca(x.lead_id, x.created_at, x.tipo));
    (mv.data || []).forEach(x => { if (x.extras && x.extras.contato) marca(x.lead_id, x.quando, x.extras.contato); });
  }
}
function alertaTxt(a) {
  if (!a) return null;
  const h = Math.floor(a.horas), d = Math.floor(a.horas / 24);
  if (a.tipo === 'retorno') return a.nivel === 'vermelho' ? `Atrasado: lead novo sem retorno há ${h}h` : `Lead novo: responda em até ${Math.max(1, 24 - h)}h`;
  if (a.tipo === 'feedback') return a.nivel === 'vermelho' ? `Atrasado: feedback da visita (${d >= 1 ? d + 'd' : h + 'h'})` : `Visita passou: registre o resultado (vence em ${Math.max(1, 24 - h)}h)`;
  if (a.tipo === 'followup') return a.nivel === 'vermelho' ? `Atrasado: follow-up da visita (${h}h)` : `Follow-up vence em ${Math.max(1, 36 - h)}h`;
  return a.nivel === 'vermelho' ? `Atrasado: sem contato há ${d} dias` : `Sem contato há ${d} dias: faça contato até amanhã`;
}

function linhaMeta(nome, feito, meta, pts, auto, ok, extra) {
  const pc = meta ? Math.min(100, Math.round(feito / meta * 100)) : (ok ? 100 : 0);
  return `<div class="meta"><div class="t"><span>${nome} <span class="selo ${auto ? '' : 'azul'}">${auto ? 'automático' : 'registro'}</span></span><span>${ok ? '<span class="selo verde">✓ ' : ''}${extra || `${feito}/${meta}`}${ok ? '</span>' : ''}</span></div>
    <div class="trilho"><div style="width:${pc}%;background:${ok ? 'var(--verde)' : 'var(--destaque)'}"></div></div><div class="p">${pts}</div></div>`;
}
// Grade do mês no estilo checklist: linhas = atividades, colunas = semanas e dias; tudo preenchido pelo que foi registrado.

  { k: 'visita_planta', n: 'Visita a imóvel na planta', meta: 1, ok: (w) => w.visita_planta >= 1, txt: (w) => `${w.visita_planta}/1` },
  { k: 'post_instagram', n: 'Posts no Instagram (2 vídeos)', meta: 3, ok: (w) => w.posts >= 3 && w.posts_video >= 2, txt: (w) => `${w.posts}/3` },
  { k: 'contatos_prospeccao', n: 'Contatos de prospecção ativa', meta: 20, ok: (w) => w.contatos_prospeccao >= 20, txt: (w) => `${w.contatos_prospeccao}/20` },
  { k: 'reativacoes', n: 'Reativação de clientes antigos', meta: 10, ok: (w) => w.reativacoes >= 10, txt: (w) => `${w.reativacoes}/10` },
  { k: 'agenciamentos', n: 'Agenciamentos aprovados', meta: 3, ok: (w) => w.agenciamentos >= 3, txt: (w) => `${w.agenciamentos}/3` },
  { k: 'visitas_realizadas', n: 'Visitas · feedback 24 h e follow-up 36 h', ok: (w) => w.visitas_realizadas > 0 && w.feedback_no_prazo >= w.visitas_realizadas && w.followup_no_prazo >= w.visitas_realizadas && !w.faltas_corretor, txt: (w) => w.visitas_realizadas ? `${Math.min(w.feedback_no_prazo, w.followup_no_prazo)}/${w.visitas_realizadas}` : '—', semMeta: true },
  { k: 'pos_venda', n: 'Pós-venda e avaliações', txt: () => '', semMeta: true, soDias: true },
  { k: 'reuniao', n: 'Reunião comercial semanal', meta: 1, ok: (w) => w.reuniao === true, txt: (w) => w.reuniao === true ? 'presente' : w.reuniao === false ? 'faltou' : 'a marcar', soSemana: true },
];
function gradeMes() {
  const g = ATV.mes; if (!g) return '';
  const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const ini = new Date(g.inicio + 'T12:00:00'), fim = new Date(g.fim + 'T12:00:00'), hoje = g.hoje;
  const dia = (d) => d.toLocaleDateString('sv-SE');
  // semanas: só os dias de segunda a sábado que caem no mês (domingo aparece se tiver registro)
  const semanas = g.semanas.map(w => { const seg = new Date(w.semana + 'T12:00:00'); const dias = [];
    for (let i = 0; i < 7; i++) { const d = new Date(+seg + i * 864e5); if (d < ini || d > fim) continue; const iso = dia(d);
      if (i === 6 && !Object.values(g.diario).some(x => x[iso])) continue; dias.push({ iso, d }); }
    return { w, dias }; }).filter(s => s.dias.length);
  const comMeta = LINHAS_GRADE.filter(l => l.ok && !l.semMeta);
  const passadas = semanas.filter(s => s.dias[0].iso <= hoje);
  const possiveis = passadas.length * comMeta.length;
  const batidas = passadas.reduce((a, s) => a + comMeta.filter(l => l.ok(s.w)).length, 0);
  const registros = Object.entries(g.diario).filter(([k]) => k !== 'contatos').reduce((a, [, v]) => a + Object.values(v).reduce((x, y) => x + y, 0), 0);
  const sigla = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  const cab1 = semanas.map((s, i) => `<th colspan="${s.dias.length + 1}" class="gsem">Semana ${i + 1}</th>`).join('');
  const cab2 = semanas.map(s => s.dias.map(x => `<th class="gdia ${x.iso === hoje ? 'ghoje' : ''}">${x.d.getDate()}<small>${sigla[x.d.getDay()]}</small></th>`).join('') + '<th class="gtot">Meta</th>').join('');
  const linhas = LINHAS_GRADE.map(l => `<tr><td class="gnome gclick" data-gcel="${l.k}" data-gdia="${hoje}" title="Clique para registrar hoje">${l.n}${l.meta && !l.soSemana ? `<small>${l.meta} por semana</small>` : ''}</td>${semanas.map(s => {
      const cel = s.dias.map(x => { const n = (g.diario[l.k] || {})[x.iso] || 0; const fut = x.iso > hoje;
        return `<td class="gcel ${x.iso === hoje ? 'ghoje' : ''}" data-gcel="${l.k}" data-gdia="${x.iso}" title="${x.iso === hoje ? 'Clique para registrar' : ''}">${l.soSemana ? '' : n ? `<span class="gn">${n}</span>` : `<span class="gvazio ${fut ? 'gfut' : ''}"></span>`}</td>`; }).join('');
      const fut = s.dias[0].iso > hoje; const ok = l.ok && l.ok(s.w);
      const tot = l.soDias ? '' : fut ? '' : `<span class="selo ${ok ? 'verde' : l.semMeta && !s.w.visitas_realizadas ? '' : 'vermelho'}">${ok ? '✓ ' : ''}${l.txt(s.w)}</span>`;
      return cel + `<td class="gtot">${tot}</td>`; }).join('')}</tr>`).join('');
  return `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
      <h2 style="font-size:16px;margin:0">Checklist do mês${gestor() ? ' · ' + esc(CORRETORES[ATV.corretor] || '') : ''}</h2>
      <div class="gmeses">${meses.map((m, i) => `<button data-gmes="${i + 1}" class="${ATV.mesNum === i + 1 ? 'principal' : ''}">${m}</button>`).join('')}</div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Metas semanais batidas</small><b>${batidas}</b></div>
      <div class="kpi"><small>Metas não batidas</small><b>${possiveis - batidas}</b></div>
      <div class="kpi"><small>Evolução do mês</small><b style="color:var(--destaque)">${possiveis ? Math.round(batidas / possiveis * 100) : 0}%</b><div class="dica">${batidas} de ${possiveis} metas semanais</div></div>
      <div class="kpi"><small>Registros no mês</small><b>${registros}</b><div class="dica">${(Object.values(g.diario.contatos || {}).reduce((a, b) => a + b, 0))} contatos com clientes</div></div>
    </div>
    <div style="overflow-x:auto"><table class="gchk"><thead><tr><th class="gnome" rowspan="2">Atividade</th>${cab1}</tr><tr>${cab2}</tr></thead><tbody>${linhas}</tbody></table></div>
    <div class="dica" style="margin-top:8px"><b>Clique no quadradinho de hoje</b> para registrar a atividade. Cada número é quanto foi registrado no dia. A coluna "Meta" fica verde quando a meta da semana foi batida. Nada é marcado à mão: tudo vem do funil, dos imóveis e das atividades registradas.</div>
  </div>`;
}

document.addEventListener('change', async e => {
  if (e.target.id === 'acorretor') { ATV.corretor = e.target.value; ATV.metas = null; render(); carregarAtividades(); }

    const { error } = await db.from('crm_vendas_reunioes').upsert({ semana: segundaDaSemana(), corretor_id: e.target.dataset.reuniao, presente: e.target.checked });
    if (error) { aviso('Não foi possível salvar a presença.', true); e.target.checked = !e.target.checked; return; }
    ATV.reuniao[e.target.dataset.reuniao] = e.target.checked; aviso('Presença salva.');
    if (e.target.dataset.reuniao === ATV.corretor) carregarAtividades();
  }
});

      foto_path = `${sessao.user.id}/atividades/${Date.now()}-${foto.name.normalize('NFD').replace(/[^\w.-]+/g, '_').slice(-60)}`;
      const up = await db.storage.from('crm-vendas').upload(foto_path, foto, { contentType: foto.type || undefined });
      if (up.error) { b.disabled = false; er.style.color = ''; er.textContent = 'Não foi possível enviar a foto.'; return; }
    }
    const row = { corretor_id: gestor() ? ATV.corretor : usuario, tipo: t, descricao: v('af_desc') || null, link: v('af_link') || null, subtipo: v('af_sub') || null, foto_path, lead_id: v('af_lead') || null,
      lat: ATV.geo?.lat ?? null, lng: ATV.geo?.lng ?? null, precisao: ATV.geo?.precisao ?? null };
    const { error } = await db.from('crm_vendas_atividades').insert(row);
    b.disabled = false;
    if (error) { er.style.color = ''; er.textContent = error.message; return; }
    aviso('Atividade registrada.'); ATV.form = ''; ATV.geo = null; carregarAtividades();
  }
  else if (ds.posvenda) modalContato(`Pós-venda · ${ds.nome} (${ds.marco} dias)`, { tipo: 'posvenda', lead: ds.posvenda, marco: +ds.marco });
  else if (ds.reativar) modalContato(`Reativação · ${ds.nome}`, { tipo: 'reativar', lead: ds.reativar });
  else if (ds.salvarcontato) {
    const alvo = JSON.parse(ds.salvarcontato), er = document.getElementById('cx_erro');
    const tipo = document.getElementById('cx_tipo').value, obs = document.getElementById('cx_obs').value.trim();
    if (!tipo) { er.textContent = 'Escolha como foi o contato.'; return; }
    if (!obs) { er.textContent = 'Escreva a observação.'; return; }
    b.disabled = true;
    let error;
    if (alvo.tipo === 'posvenda') {
      ({ error } = await db.from('crm_vendas_atividades').insert({ corretor_id: gestor() ? ATV.corretor : usuario, tipo: 'pos_venda', lead_id: alvo.lead, descricao: obs, extras: { marco: alvo.marco, contato: tipo } }));
    } else {
      const paraFunil = document.getElementById('cx_funil')?.checked;
      const st = FUN.status.find(s => paraFunil ? (s.nome === 'Respondeu') : s.tipo === 'contato');
      ({ error } = await db.rpc('crm_vendas_mover_lead', { p_lead: alvo.lead, p_status: st.id, p_obs: obs, p_extras: { contato: tipo } }));
    }
    b.disabled = false;
    if (error) { er.textContent = error.message; return; }
    fecharModal(); aviso('Contato registrado.');
    await Promise.all([carregarAtividades(), carregarFunil()]);
  }
});

// ---------- pontuação do game de desenvolvimento (semestre) ----------
const PTS = { carregado: false, ranking: null, aberto: null };
async function carregarPontos() {
  PTS.carregado = true;
  const { data, error } = await db.rpc('crm_vendas_ranking');
  if (error) { aviso('Não foi possível calcular a pontuação.', true); return; }
  PTS.ranking = (data || []).map(r => VER && r.corretor_id !== VER ? (({ itens, ...x }) => x)(r) : r);
  if (VER) PTS.aberto = VER;
  if (!PTS.aberto) PTS.aberto = gestor() ? PTS.ranking[0]?.corretor_id : usuario;
  if (tela.nome === 'pontos') render();
}
const fmtPts = (n) => Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });

      ${!r.ativado ? '<div class="aviso" style="background:var(--ambar-claro);color:var(--ambar);margin:8px 0">Os pontos ficam guardados e só passam a valer depois da primeira venda no semestre.</div>' : ''}
      ${Number(r.corte_teto) > 0 ? `<div class="aviso" style="background:var(--azul-claro);color:var(--azul);margin:8px 0">Agenciamento passou de 42% do total: ${fmtPts(r.corte_teto)} pontos de agenciamento não contam.</div>` : ''}

// ---------- painel de gestão ----------
const PNL = { dados: null, periodo: '30d' };
function periodoPainel() {
  const agora = new Date(); const br = new Date(agora.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
  const inicioDia = new Date(br.getFullYear(), br.getMonth(), br.getDate());
  const off = agora - br; // diferença do fuso
  const ini = { hoje: inicioDia, '7d': new Date(inicioDia - 6 * 864e5), '30d': new Date(inicioDia - 29 * 864e5), mes: new Date(br.getFullYear(), br.getMonth(), 1),
    tri: new Date(br.getFullYear(), Math.floor(br.getMonth() / 3) * 3, 1) }[PNL.periodo];
  return [new Date(+ini + off).toISOString(), agora.toISOString()];
}
async function carregarPainel() {
  const [ini, fim] = periodoPainel();
  const { data, error } = await db.rpc('crm_vendas_painel', { p_ini: ini, p_fim: fim });
  if (error) { aviso('Não foi possível carregar o painel.', true); return; }
  PNL.dados = data; if (tela.nome === 'painel') render();
}

      ${Number(c.total_time) > 0 ? `<div class="linha"><span>Time Platina (5%)</span><span>${brl(c.total_time)}</span></div>` : ''}
      <div class="linha" style="font-weight:700"><span style="color:var(--texto)">Total do trimestre</span><span>${brl(c.total_a_receber)}</span></div>
      <div class="dica" style="margin-top:12px">Regras: Ferro 30% · Prata 40% (2 vendas e R$ 600 mil) · Ouro 50% (3 e R$ 900 mil) · Platina 50% + time (5 e R$ 1,5 mi). Construção Projetar: 40/50/60/60%. Sobe quantos níveis atingir, mantém se repetir, desce um nível se ficar abaixo. A categoria apurada vale para as vendas do trimestre e para o próximo.</div>
    </div>
  </div>`;
}
document.addEventListener('change', e => {
  if (e.target.id === 'ctri') { const [y, t] = e.target.value.split('-').map(Number); COM.ano = y; COM.tri = t; COM.dados = null; render(); carregarComissao(); }
  if (e.target.id === 'ccor') { COM.aberto = e.target.value; render(); }
});
document.addEventListener('click', e => { const b = e.target.closest('[data-abrircom]'); if (b) { COM.aberto = b.dataset.abrircom; render(); } });

// ---------- login (mesmo login do CRM Leads) ----------
const $ = (id) => document.getElementById(id);
async function entrar(s) {
  sessao = s;
  if (!s) { $('login').hidden = false; $('app').hidden = true; $('quem').hidden = true; $('abas').innerHTML = ''; return; }
  const { data: participa } = await db.rpc('crm_vendas_participa');
  if (!participa) {
    await db.auth.signOut(); sessao = null;
    $('erro-login').textContent = 'Este login ainda não tem acesso ao CRM Vendas. Fale com o Marco.';
    $('login').hidden = false; $('app').hidden = true; return;
  }
  const [{ data: aprov }, { data: meu }, { data: cors }] = await Promise.all([
    db.rpc('crm_vendas_aprovador'), db.rpc('crm_meu_corretor'), db.from('corretores').select('id, nome, ativo'),
  ]);
  souAprovador = !!aprov; usuario = meu; MEU_CORRETOR = meu; VER = null;
  CORRETORES = Object.fromEntries((cors || []).map(c => [c.id, c.nome]));
  CORRETORES_ATIVOS = (cors || []).filter(c => c.ativo).sort((a, b) => a.nome.localeCompare(b.nome));
  NOME_GESTOR = (CORRETORES[meu] || s.user.email.split('@')[0]).split(' ')[0];
  NOME_GESTOR = NOME_GESTOR.charAt(0).toUpperCase() + NOME_GESTOR.slice(1);
  $('quem-nome').textContent = souAprovador ? `${NOME_GESTOR} · gestor` : (CORRETORES[usuario] || s.user.email);
  $('vercomo-box').hidden = !souAprovador;
  if (souAprovador) {
    const { data: g } = await db.rpc('crm_vendas_corretores_game');
    const ids = (g || []).map(x => typeof x === 'string' ? x : Object.values(x)[0]);
    $('vercomo').innerHTML = '<option value="">Gestor (você)</option>' + ids.map(id => `<option value="${id}">${esc(CORRETORES[id] || id)} (corretor)</option>`).join('');
  }
  $('login').hidden = true; $('app').hidden = false; $('quem').hidden = false;
  await Promise.all([carregar(), carregarFunil()]);
  if (modoLink && usuario && !souAprovador) abrirForm(novoImovel(usuario)); else { modoLink = false; tela = { nome: souAprovador ? 'painel' : 'funil' }; render(); }
}
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('erro-login').textContent = '';
  const { data, error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('senha').value });
  if (error) { $('erro-login').textContent = 'E-mail ou senha incorretos.'; return; }
  entrar(data.session);
});
$('vercomo').addEventListener('change', async (e) => {
  VER = e.target.value || null;
  usuario = VER || MEU_CORRETOR;
  document.body.classList.toggle('vendo-como', !!VER);
  $('quem-nome').textContent = VER ? `vendo como ${CORRETORES[VER]}` : `${NOME_GESTOR} · gestor`;
  ATV.carregado = false; ATV.metas = null; PTS.carregado = false; PTS.ranking = null; COM.carregado = false; COM.dados = null; PNL.dados = null;
  await Promise.all([carregar(), carregarFunil()]);
  tela = { nome: 'funil' }; render();
});
$('sair').addEventListener('click', async () => { await db.auth.signOut(); entrar(null); });
db.auth.getSession().then(({ data }) => entrar(data.session));
</script>
